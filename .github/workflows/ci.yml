name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  # Replace or extend this job with the checks this repository actually owns,
  # and add its id to the `needs` list below.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/bin"
          mkdir -p "${bin_dir}"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL \
            -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${bin_dir}" actionlint
          echo "${bin_dir}" >> "$GITHUB_PATH"
      - name: GitHub Actions lint
        run: actionlint

  # The organization ruleset requires a check named exactly `CI status` on the
  # default branch of every repository. Keep this job's name and add every
  # other job to `needs`.
  ci-status:
    name: CI status
    if: always()
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          if [ "$FAILED" = "true" ]; then
            echo "::error::one or more CI jobs did not succeed"
            exit 1
          fi
          echo "all CI jobs passed or were skipped"
